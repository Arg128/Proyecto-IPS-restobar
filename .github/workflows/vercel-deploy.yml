name: CI & Deploy (Turborepo) -> Vercel

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  NODE_OPTIONS: "--max_old_space_size=4096"

jobs:
  ci:
    name: CI (turbo)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Cache turbo ~/.cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/turbo
            node_modules
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Build changed packages with turbo
        run: CI=false npx turbo run build

      - name: Run tests (turbo)
        run: npx turbo run test --concurrency 3 || true

      - name: Lint (turbo)
        run: npx turbo run lint --concurrency 2 || true

      - name: 'notify vercel - admin - frontend'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: "Vercel - ips_admin_frontend: lint"

      - name: 'notify vercel - mesas - frontend'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: "Vercel - proyecto-ips-restobar-mesas-frontend: lint"

      - name: 'notify vercel - cocina - frontend'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: "Vercel - proyecto-ips-restobar-cocina-frontend: lint"

      - name: 'notify vercel - caja - frontend'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: "Vercel - proyecto-ips-restobar-caja-frontend: lint"

      - name: 'notify vercel - delivery - frontend'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: "Vercel - proyecto-ips-restobar-delivery-frontend: lint"

      - name: 'notify vercel - resto - backend'
        uses: 'vercel/repository-dispatch/actions/status@v1'
        with:
          name: "Vercel - proyecto-ips-restobar-resto-backend: lint"

      - name: Upload frontend build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-builds
          path: |
            apps/admin-frontend/build
            apps/mesas-frontend/build
            apps/cocina-frontend/build
            apps/caja-frontend/build
            apps/delivery-frontend/build

  deploy:
    name: Deploy ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        app:
          - { name: admin-frontend, dir: apps/admin-frontend }
          - { name: mesas-frontend, dir: apps/mesas-frontend }
          - { name: cocina-frontend, dir: apps/cocina-frontend }
          - { name: caja-frontend, dir: apps/caja-frontend }
          - { name: delivery-frontend, dir: apps/delivery-frontend }
          - { name: resto-backend, dir: apps/resto-backend }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install root deps
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-builds
          path: .
        continue-on-error: true

      - name: Install Vercel CLI
        run: pnpm add -g vercel@34

      - name: Deploy ${{ matrix.app.name }} to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[format('VERCEL_PROJECT_ID_{0}', matrix.app.name)] }}
        run: |
          vercel --token "$VERCEL_TOKEN" --prod --confirm ./${{ matrix.app.dir }} \
            --scope "$VERCEL_ORG_ID" || true
